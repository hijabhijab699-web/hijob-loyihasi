# Public API host. Replace api.example.com with your real domain before deploy —
# also update the ssl_certificate paths and the ACME challenge server name.

# ACME (Let's Encrypt) — plain HTTP for certbot challenges only.
server {
    listen 80;
    server_name ${API_DOMAIN};

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else is redirected to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# Main API — HTTPS with HSTS.
server {
    listen 443 ssl;
    http2 on;
    server_name ${API_DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${API_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${API_DOMAIN}/privkey.pem;
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Auth endpoints — stricter rate limit.
    location ~ ^/api/v1/auth/(register|login|refresh) {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://api:4000;
        include /etc/nginx/conf.d/proxy_headers.conf;
    }

    # Everything else on the API.
    location / {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://api:4000;
        include /etc/nginx/conf.d/proxy_headers.conf;
    }
}
