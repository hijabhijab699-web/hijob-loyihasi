[project]
name = "n2431-ml-garment"
version = "0.1.0"
description = "N24:31 garment (scarf/dress/bag) template extractor"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "numpy>=1.26.0,<2.0.0",
    "opencv-python-headless>=4.10.0.84",
    "mediapipe==0.10.20",
    "pillow>=11.0.0",
    "rembg[cpu]>=2.0.60",
    "onnxruntime>=1.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
